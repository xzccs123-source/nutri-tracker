<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>习惯养成</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--c0:#000;--c1:#111;--c2:#333;--c4:#666;--c5:#999;--c6:#ccc;--c7:#e5e5e5;
  --c8:#f0f0f0;--c9:#f7f7f7;--cw:#fff;--ff:-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ff);font-weight:300;color:var(--c1);background:var(--cw);min-height:100vh;letter-spacing:.01em}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-weight:300}
input{font-family:inherit;font-size:.9rem;color:var(--c1);outline:none}

nav.tabs{display:flex;gap:32px;padding:20px 24px 0;border-bottom:1px solid var(--c7);position:sticky;top:0;background:var(--cw);z-index:10}
nav.tabs button{font-size:.85rem;font-weight:400;color:var(--c5);padding:0 0 12px;border-bottom:2px solid transparent;transition:all .15s;letter-spacing:.04em}
nav.tabs button:hover{color:var(--c2)}
nav.tabs button.active{color:var(--c0);border-bottom-color:var(--c0);font-weight:500}
main{max-width:680px;margin:0 auto;padding:24px 20px 80px}
.tab-panel{display:none}
.tab-panel.active{display:block}

.section{margin-bottom:28px}
.section-hd{font-size:.8rem;font-weight:500;color:var(--c5);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border:1px solid var(--c0);font-size:.8rem;font-weight:400;letter-spacing:.02em;transition:all .15s;white-space:nowrap;background:var(--c0);color:var(--cw)}
.btn:hover{background:var(--c2);border-color:var(--c2)}
.btn-dim{border-color:var(--c7);background:var(--cw);color:var(--c2)}
.btn-dim:hover{background:var(--c9)}
.btn-xs{padding:3px 9px;font-size:.72rem;border:1px solid var(--c7);background:var(--cw);min-width:24px;text-align:center}
.btn-xs:hover{background:var(--c9)}

/* Date nav */
.date-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:20px}
.date-nav button{font-size:1.1rem;color:var(--c5);padding:4px 8px;transition:all .15s}
.date-nav button:hover{color:var(--c0)}
.date-nav .date-text{font-size:1rem;font-weight:400;min-width:140px;text-align:center}
.date-nav .date-dow{font-size:.78rem;color:var(--c5)}

.today-summary{text-align:center;font-size:.82rem;color:var(--c5);margin-bottom:16px;letter-spacing:.04em}

/* Habit row in today view */
.habit-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--c8)}
.habit-row .toggle-btn{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--c2);display:flex;align-items:center;justify-content:center;font-size:1rem;cursor:pointer;flex-shrink:0;padding:0;line-height:1;transition:all .15s}
.habit-row .toggle-btn.done{background:var(--c0);border-color:var(--c0);color:var(--cw)}
.habit-row .habit-label{flex:1;font-size:.88rem;font-weight:300}
.habit-row .week-dots{display:flex;gap:4px;flex-shrink:0}
.habit-row .week-dots .wd{width:8px;height:8px;border-radius:50%}
.habit-row .week-dots .wd.fill{background:var(--c0)}
.habit-row .week-dots .wd.emp{border:1px solid var(--c6);background:transparent}

/* Mini calendar */
.mc{display:inline-block;vertical-align:top}
.mc-title{font-size:.7rem;color:var(--c5);text-align:center;margin-bottom:4px;letter-spacing:.04em}
.mc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;justify-items:center}
.mc-grid span{width:16px;height:16px;display:flex;align-items:center;justify-content:center;font-size:.58rem}
.mc-grid .mc-hd{color:var(--c5);font-size:.55rem}
.mc-grid .mc-done{color:var(--c0);font-weight:500}
.mc-grid .mc-miss{color:var(--c6)}
.mc-grid .mc-fut{color:transparent}

/* Habit card */
.habit-card{border:1px solid var(--c7);padding:16px;margin-bottom:10px;cursor:pointer;transition:border-color .15s}
.habit-card:hover{border-color:var(--c0)}
.habit-card .hc-name{font-size:.9rem;font-weight:400;margin-bottom:10px}
.habit-card .hc-cals{display:flex;gap:16px;flex-wrap:wrap}

/* Detail view */
.detail-hd{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.detail-hd .back-btn{font-size:.85rem;color:var(--c5);padding:4px 0}
.detail-hd .back-btn:hover{color:var(--c0)}
.detail-name{font-size:1.1rem;font-weight:400;cursor:pointer;padding:2px 0;border-bottom:2px solid transparent}
.detail-name:hover{border-bottom-color:var(--c6)}
.detail-name-edit{border:none;border-bottom:2px solid var(--c0);font-size:1.1rem;font-weight:400;padding:2px 0;width:200px;background:transparent}

.stat-row{display:flex;gap:24px;margin:16px 0;flex-wrap:wrap}
.stat-item{text-align:center;min-width:80px}
.stat-item .sv{font-size:1.4rem;font-weight:300}
.stat-item .sl{font-size:.7rem;color:var(--c5);margin-top:2px;letter-spacing:.04em}

.months-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;margin:16px 0}
.chart-box{position:relative;height:220px;margin:16px 0}

/* Util bar */
.util-bar{display:flex;gap:12px;justify-content:center;padding:16px 0 0;border-top:1px solid var(--c7);margin-top:28px}
.util-bar button{font-size:.72rem;color:var(--c5);letter-spacing:.04em;padding:4px 0;border-bottom:1px dotted var(--c6);transition:all .15s}
.util-bar button:hover{color:var(--c0);border-bottom-color:var(--c0)}

.empty{padding:32px;text-align:center;color:var(--c5);font-size:.82rem}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--c0);color:var(--cw);padding:9px 22px;font-size:.8rem;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

hr.divider{border:none;border-top:1px solid var(--c7);margin:20px 0}

.inp-sm{padding:6px 8px;border:1px solid var(--c7);font-size:.82rem;font-family:inherit;width:100%;background:var(--cw)}
.inp-sm:focus{border-color:var(--c0)}
</style>
</head>
<body>

<nav class="tabs">
  <button class="active" data-tab="today">今日</button>
  <button data-tab="habits">习惯</button>
</nav>

<main>
  <!-- === 今日 === -->
  <section class="tab-panel active" id="tab-today">
    <div class="date-nav">
      <button id="date-prev">&lsaquo;</button>
      <div><div class="date-text" id="date-label"></div><div class="date-dow" id="date-dow"></div></div>
      <button id="date-next">&rsaquo;</button>
    </div>
    <div class="today-summary" id="today-summary"></div>
    <div id="today-list"></div>
    <div class="empty" id="today-empty" style="display:none">暂无习惯。<a href="#" id="go-habits" style="color:var(--c0);text-decoration:underline">去添加</a></div>
  </section>

  <!-- === 习惯 === -->
  <section class="tab-panel" id="tab-habits">
    <div id="habits-list-view">
      <div class="section" style="margin-bottom:16px">
        <button class="btn btn-dim" id="btn-new-habit">+ 新建习惯</button>
      </div>
      <div id="habits-cards"></div>
      <div class="empty" id="habits-empty" style="display:none">暂无习惯，点击上方按钮创建。</div>
    </div>
    <div id="habit-detail-view" style="display:none">
      <div class="detail-hd">
        <button class="back-btn" id="detail-back">← 返回</button>
        <span class="spacer"></span>
        <button class="btn-xs" id="detail-delete" style="color:#b91c1c">删除</button>
      </div>
      <div id="detail-name-area"></div>
      <div class="stat-row" id="detail-stats"></div>
      <div class="section-hd">月度日历</div>
      <div class="months-grid" id="detail-months"></div>
      <div class="section-hd">月度完成趋势</div>
      <div class="chart-box"><canvas id="ch-monthly"></canvas></div>
    </div>
  </section>

  <div class="util-bar">
    <button id="btn-export">导出数据</button>
    <button id="btn-import">导入数据</button>
    <input type="file" id="import-file" accept=".json" style="display:none">
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
// ============ DATA ============
const K='ht-v1';
const DEF={habits:[]};
let d;
function load(){try{const r=localStorage.getItem(K);d=r?{...DEF,...JSON.parse(r)}:JSON.parse(JSON.stringify(DEF));}catch(e){d=JSON.parse(JSON.stringify(DEF));}}
function save(){localStorage.setItem(K,JSON.stringify(d));}
load();
function ts(){const dt=new Date();return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}
function gid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

let todayDate=ts();
let viewingHabitId=null;

// ============ TOAST ============
let tt;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),1600);}

// ============ TAB SWITCHING ============
function switchTab(name){
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  document.querySelector('[data-tab="'+name+'"]').classList.add('active');
  if(name==='today')renderToday();
  if(name==='habits')renderHabits();
}
document.querySelectorAll('nav.tabs button').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));

// ============ HELPERS ============
const DOW_ZH=['日','一','二','三','四','五','六'];
function fmtDateCN(dateStr){
  const [y,m,d]=dateStr.split('-');
  return y+'年'+parseInt(m)+'月'+parseInt(d)+'日';
}
function fmtDow(dateStr){
  const dt=new Date(dateStr);
  if(isNaN(dt.getTime()))return'';
  return '周'+DOW_ZH[dt.getDay()];
}
function daysInMonth(y,m){return new Date(y,m+1,0).getDate();}
function dateStr(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');}

// ============ MINI CALENDAR RENDERING ============
function miniCalHTML(year, month, completions, today){
  const dim=daysInMonth(year,month);
  const fd=new Date(year,month,1).getDay();
  let h='<div class="mc"><div class="mc-title">'+(month+1)+'月</div><div class="mc-grid">';
  DOW_ZH.forEach(d=>{h+='<span class="mc-hd">'+d+'</span>';});
  for(let i=0;i<fd;i++) h+='<span></span>';
  for(let day=1;day<=dim;day++){
    const ds=dateStr(year,month,day);
    if(ds>today) h+='<span class="mc-fut">·</span>';
    else if(completions[ds]) h+='<span class="mc-done">●</span>';
    else h+='<span class="mc-miss">○</span>';
  }
  h+='</div></div>';
  return h;
}

// ============ RENDER: TODAY ============
function setToday(ds){
  todayDate=ds;
  document.getElementById('date-label').textContent=fmtDateCN(ds);
  document.getElementById('date-dow').textContent=fmtDow(ds);
  renderToday();
}
document.getElementById('date-prev').addEventListener('click',()=>{
  const dt=new Date(todayDate);dt.setDate(dt.getDate()-1);setToday(dt.toISOString().slice(0,10));
});
document.getElementById('date-next').addEventListener('click',()=>{
  const dt=new Date(todayDate);dt.setDate(dt.getDate()+1);
  if(dt.toISOString().slice(0,10)<=ts())setToday(dt.toISOString().slice(0,10));
});

function renderToday(){
  const ds=todayDate;
  document.getElementById('date-label').textContent=fmtDateCN(ds);
  document.getElementById('date-dow').textContent=fmtDow(ds);
  document.getElementById('date-next').disabled=ds>=ts();

  const list=document.getElementById('today-list');
  const empty=document.getElementById('today-empty');
  const summary=document.getElementById('today-summary');

  if(d.habits.length===0){
    list.innerHTML='';empty.style.display='block';summary.textContent='';
    return;
  }
  empty.style.display='none';

  let doneCount=0;
  list.innerHTML=d.habits.map(h=>{
    const isDone=!!h.completions[ds];
    if(isDone)doneCount++;
    // Past 7 days dots
    let dots='';
    for(let i=6;i>=0;i--){
      const dt=new Date(ds);dt.setDate(dt.getDate()-i);
      const dd=dt.toISOString().slice(0,10);
      const ok=!!h.completions[dd];
      dots+='<span class="wd'+(ok?' fill':' emp')+'"></span>';
    }
    return`<div class="habit-row">
      <button class="toggle-btn${isDone?' done':''}" onclick="toggleHabit('${h.id}','${ds}')">${isDone?'✓':''}</button>
      <span class="habit-label">${h.name}</span>
      <span class="week-dots">${dots}</span>
    </div>`;
  }).join('');
  summary.textContent='已完成 '+doneCount+'/'+d.habits.length;
}

function toggleHabit(hid,ds){
  const h=d.habits.find(x=>x.id===hid);
  if(!h)return;
  if(h.completions[ds]){delete h.completions[ds];}else{h.completions[ds]=true;}
  save();
  renderToday();
}
document.getElementById('go-habits').addEventListener('click',e=>{e.preventDefault();switchTab('habits');});

// ============ RENDER: HABITS LIST ============
function renderHabits(){
  viewingHabitId=null;
  document.getElementById('habits-list-view').style.display='';
  document.getElementById('habit-detail-view').style.display='none';
  renderHabitsList();
}

function renderHabitsList(){
  const container=document.getElementById('habits-cards');
  const empty=document.getElementById('habits-empty');
  if(d.habits.length===0){
    container.innerHTML='';empty.style.display='block';return;
  }
  empty.style.display='none';
  const t=ts();
  const now=new Date();
  const thisM=now.getMonth();
  const thisY=now.getFullYear();
  let lastM=thisM-1,lastY=thisY;
  if(lastM<0){lastM=11;lastY--;}

  container.innerHTML=d.habits.map(h=>`
    <div class="habit-card" onclick="openHabitDetail('${h.id}')">
      <div class="hc-name">${h.name}</div>
      <div class="hc-cals">
        ${miniCalHTML(lastY,lastM,h.completions,t)}
        ${miniCalHTML(thisY,thisM,h.completions,t)}
      </div>
    </div>
  `).join('');
}

// ============ HABIT DETAIL ============
function openHabitDetail(hid){
  viewingHabitId=hid;
  document.getElementById('habits-list-view').style.display='none';
  document.getElementById('habit-detail-view').style.display='';
  renderHabitDetail();
}

function renderHabitDetail(){
  const h=d.habits.find(x=>x.id===viewingHabitId);
  if(!h){renderHabits();return;}

  // Name
  document.getElementById('detail-name-area').innerHTML=
    '<span class="detail-name" id="detail-name-text" onclick="editHabitName()">'+h.name+'</span>';

  // Stats
  const t=ts();
  const now=new Date();
  const thisY=now.getFullYear();
  const thisM=now.getMonth();

  // Total completions
  const totalDone=Object.keys(h.completions).length;

  // This month rate
  const dim=daysInMonth(thisY,thisM);
  const daysPassed=Math.min(parseInt(t.slice(8)),dim);
  let thisMonthDone=0;
  for(let d=1;d<=daysPassed;d++){
    if(h.completions[dateStr(thisY,thisM,d)])thisMonthDone++;
  }
  const monthRate=daysPassed>0?Math.round(thisMonthDone/daysPassed*100):0;

  // Last 30 days
  let last30=0;
  for(let i=0;i<30;i++){
    const dt=new Date(t);dt.setDate(dt.getDate()-i);
    if(h.completions[dt.toISOString().slice(0,10)])last30++;
  }

  document.getElementById('detail-stats').innerHTML=`
    <div class="stat-item"><div class="sv">${totalDone}</div><div class="sl">总完成</div></div>
    <div class="stat-item"><div class="sv">${monthRate}%</div><div class="sl">本月完成率</div></div>
    <div class="stat-item"><div class="sv">${last30}</div><div class="sl">近30天</div></div>
  `;

  // 12 months of mini calendars
  let monthsHTML='';
  for(let i=11;i>=0;i--){
    let m=thisM-i,y=thisY;
    if(m<0){m+=12;y--;}
    monthsHTML+=miniCalHTML(y,m,h.completions,t);
  }
  document.getElementById('detail-months').innerHTML=monthsHTML;

  // Monthly bar chart
  renderMonthlyChart(h);
}

function editHabitName(){
  const h=d.habits.find(x=>x.id===viewingHabitId);
  if(!h)return;
  const area=document.getElementById('detail-name-area');
  area.innerHTML='<input class="detail-name-edit" id="name-edit-inp" value="'+h.name.replace(/"/g,'&quot;')+'">';
  const inp=document.getElementById('name-edit-inp');
  inp.focus();inp.select();
  const saveName=()=>{
    const v=inp.value.trim();
    if(v){h.name=v;save();}
    renderHabitDetail();
  };
  inp.addEventListener('blur',saveName);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){inp.blur();}});
}

function renderMonthlyChart(h){
  const now=new Date();
  const thisY=now.getFullYear();
  const thisM=now.getMonth();
  const labels=[],data=[];

  for(let i=11;i>=0;i--){
    let m=thisM-i,y=thisY;
    if(m<0){m+=12;y--;}
    labels.push((m+1)+'月');
    let count=0;
    const dim=daysInMonth(y,m);
    for(let d=1;d<=dim;d++){
      if(h.completions[dateStr(y,m,d)])count++;
    }
    data.push(count);
  }

  const canvas=document.getElementById('ch-monthly');
  const ctx=canvas.getContext('2d');
  // Destroy existing chart
  const existing=Chart.getChart(canvas);
  if(existing)existing.destroy();

  new Chart(ctx,{type:'bar',data:{labels,datasets:[
    {label:'月完成天数',data,backgroundColor:'#000',borderRadius:0}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{
    y:{grid:{color:'#f0f0f0'},ticks:{font:{size:9},stepSize:1},title:{display:true,text:'天',font:{size:9,weight:300}}},
    x:{grid:{display:false},ticks:{font:{size:9}}}
  }}});
}

document.getElementById('detail-back').addEventListener('click',renderHabits);
document.getElementById('detail-delete').addEventListener('click',()=>{
  if(!confirm('确定删除该习惯？所有记录将丢失。'))return;
  d.habits=d.habits.filter(x=>x.id!==viewingHabitId);
  save();
  renderHabits();
  toast('已删除');
});

// ============ NEW HABIT ============
document.getElementById('btn-new-habit').addEventListener('click',()=>{
  const name=prompt('习惯名称：');
  if(!name||!name.trim())return;
  d.habits.push({id:gid(),name:name.trim(),completions:{}});
  save();
  renderHabitsList();
  toast('已创建：'+name.trim());
});

// ============ IMPORT / EXPORT ============
document.getElementById('btn-export').addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='habit-tracker-backup-'+ts()+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('数据已导出');
});

document.getElementById('btn-import').addEventListener('click',()=>{
  document.getElementById('import-file').click();
});

document.getElementById('import-file').addEventListener('change',e=>{
  const file=e.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const imported=JSON.parse(ev.target.result);
      if(!imported.habits||!Array.isArray(imported.habits)){toast('文件格式不正确');return;}
      const existIds=new Set(d.habits.map(h=>h.id));
      imported.habits.forEach(ih=>{
        if(existIds.has(ih.id)){
          const cur=d.habits.find(h=>h.id===ih.id);
          if(cur&&ih.completions) cur.completions={...cur.completions,...ih.completions};
          if(cur&&ih.name) cur.name=ih.name;
        }else{
          d.habits.push({...ih,completions:{...(ih.completions||{})}});
          existIds.add(ih.id);
        }
      });
      save();
      toast('数据已导入并合并');
      if(viewingHabitId)renderHabitDetail();
      else renderHabitsList();
    }catch(err){toast('文件解析失败');}
  };
  reader.readAsText(file);
  e.target.value='';
});

// ============ INIT ============
setToday(ts());
</script>
</body>
</html>
